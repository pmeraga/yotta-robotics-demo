app = "yotta-demo-api"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  MAX_UPLOAD_BYTES = "52428800"
  MAX_FRAMES = "1200"
  MAX_DURATION_SEC = "45"
  MAX_ACTIVE_JOBS = "3"
  JOB_TTL_SEC = "3600"
  JOB_ROOT = "/tmp/yotta"
  # Replace with the deployed frontend origin before going public.
  ALLOWED_ORIGINS = "https://yotta-robotics-demo.vercel.app"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  # Video work is CPU-bound and jobs run in-process, so queue rather than pile on.
  [http_service.concurrency]
    type = "requests"
    soft_limit = 8
    hard_limit = 16

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
