name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  web:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web

  guardrails:
    name: Public repo guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No pipeline internals in public source
        run: python3 scripts/check_public_surface.py
