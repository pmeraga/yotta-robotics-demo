name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # YOTTA_CORE_TOKEN is a fine-grained PAT with read-only access to
      # pmeraga/yotta-core and nothing else. It is passed as a BuildKit secret so it
      # never lands in an image layer.
      - name: Deploy to Fly
        working-directory: api
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy --remote-only \
            --build-secret yotta_core_token="${{ secrets.YOTTA_CORE_TOKEN }}"
